<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Giro de Estudos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: cabeçalho com métricas, abas, e painel duplo (anel do ciclo + lista de sessões). Dark first. */
:root{
  --bg:#0e1416; --surface:#151d20; --surface2:#1c272b; --line:#26343a; --track:#233036;
  --fg:#e8eeec; --muted:#8fa2a5; --accent:#f2a93b; --accent-ink:#1a1203; --accent-text:#f2a93b;
  --ok:#3fb8a5; --bad:#e5675a; --easy:#3fb8a5; --mid:#e0b04a; --hard:#e5675a;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f2f5f2; --surface:#ffffff; --surface2:#e9efeb; --line:#d3dcd7; --track:#dde6e1;
  --fg:#142022; --muted:#566a6d; --accent:#e39a1f; --accent-ink:#1a1203; --accent-text:#8a5100;
  --ok:#12806f; --bad:#b93a2e; --easy:#12806f; --mid:#8a6a10; --hard:#b93a2e; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f2f5f2; --surface:#ffffff; --surface2:#e9efeb; --line:#d3dcd7; --track:#dde6e1;
  --fg:#142022; --muted:#566a6d; --accent:#e39a1f; --accent-ink:#1a1203; --accent-text:#8a5100;
  --ok:#12806f; --bad:#b93a2e; --easy:#12806f; --mid:#8a6a10; --hard:#b93a2e; color-scheme:light}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.brand h1{font-size:1.6rem;line-height:1}
.brand span{display:block;color:var(--muted);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.top-right{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:110px}
.stat b{display:block;font:600 1.25rem/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase}
.stat.hot b{color:var(--accent-text)}
.stat.ok b{color:var(--ok)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--muted);font-weight:500;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--fg)}
.tab[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .n{font:600 .72rem var(--f-mono);background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:1px 7px;margin-left:6px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:8px 16px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 12px;font-size:.85rem}
.btn.icon{padding:7px 10px;font-size:.85rem}
.btn.danger{border-color:var(--bad);color:var(--bad)}

/* ciclo */
.grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:880px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.ringbox{position:relative;max-width:340px;margin:0 auto}
.ringbox svg{display:block;width:100%;height:auto}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 22%;gap:4px}
.ring-center .eyebrow{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ring-center h2{font-size:1.15rem;line-height:1.15}
.ring-center p{margin:0;color:var(--muted);font-size:.85rem}
.ring-center .btn{margin-top:8px}
.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 16px;margin:14px 0 0;color:var(--muted);font-size:.82rem}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.lapstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.lapstats div{background:var(--surface2);border-radius:10px;padding:10px 12px}
.lapstats b{display:block;font:600 1.05rem var(--f-mono)}
.lapstats small{color:var(--muted);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase}

.goal-box{margin-top:14px;background:var(--surface2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.goal-top{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;gap:8px}
.goal-top b{font-family:var(--f-mono)}

.sec-head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px}
.sec-head h2{font-size:1.25rem}
.sec-head .actions{display:flex;gap:8px;flex-wrap:wrap}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--surface2);border:1px solid transparent;border-radius:12px;padding:12px 14px}
.row.now{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface2))}
.row.done{opacity:.72}
.num{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font:600 .85rem var(--f-mono)}
.row.now .num{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row.done .num{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.r-main{flex:1 1 180px;min-width:0}
.r-main b{display:block;font:600 .95rem var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.r-sub{color:var(--muted);font-size:.85rem}
.bar{height:4px;background:var(--track);border-radius:4px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.row.now .bar i{background:var(--accent)}
.chip{font:600 .75rem var(--f-mono);border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--muted)}
.chip.due{color:var(--accent-text);border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.tag{font-size:.78rem;font-weight:600;padding:2px 10px;border-radius:99px;border:1px solid currentColor}
.d-fácil{color:var(--easy)}.d-médio{color:var(--mid)}.d-difícil{color:var(--hard)}
.edit-in{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px;align-items:center}
.edit-in input,.edit-in select,.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.edit-in input[type=text]{flex:1 1 140px}
.edit-in input[type=number]{width:84px}

.addsub{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.addsub input[type=text]{flex:1 1 180px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.addsub input[type=number]{width:90px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.addsub select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}

/* estudo */
.study{max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.study-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.study-head h2{font-size:1.3rem}
.clock{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;justify-content:space-between}
.clock-left{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.clock .t{font:600 1.65rem var(--f-mono);font-variant-numeric:tabular-nums}
.clock .m{color:var(--muted);font-size:.85rem}
.clock-actions{display:flex;gap:6px;flex-wrap:wrap}
.progress{height:6px;background:var(--track);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .4s}
.banner{background:color-mix(in srgb,var(--ok) 14%,var(--surface));border:1px solid var(--ok);border-radius:12px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 24px;min-height:240px;display:flex;flex-direction:column;gap:18px}
.card .lab{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card .q{font:600 1.35rem/1.35 var(--f-display);text-wrap:pretty}
.card .a{border-top:1px dashed var(--line);padding-top:16px;font-size:1.05rem;line-height:1.55}
.card .a .lab{color:var(--accent-text);margin-bottom:6px}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.rate{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rate button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-weight:600}
.rate button small{font:400 .75rem var(--f-mono);color:var(--muted)}
.rate .r0{border-color:var(--bad)}.rate .r1{border-color:var(--mid)}.rate .r2{border-color:var(--ok)}.rate .r3{border-color:var(--accent)}
.rate button:hover{background:var(--surface)}
.hint{color:var(--muted);font-size:.8rem;text-align:center;margin:0}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:32px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{font-size:1.2rem}
.empty p{margin:0;color:var(--muted);max-width:46ch}

.study-tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.stool{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.stool h3{font-size:.98rem}
.q-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.q-row input{width:76px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:var(--f-mono)}
.stool textarea,.stool input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
.stool textarea{min-height:68px;resize:vertical}

/* criar e lista */
.create-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field textarea{min-height:96px;resize:vertical}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.toolbar input,.toolbar select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.toolbar input{flex:1 1 200px}
.clist{display:flex;flex-direction:column;gap:8px}
.ci{background:var(--surface2);border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-start}
.ci .tx{flex:1 1 260px;min-width:0}
.ci .tx b{display:block;font-weight:600;overflow-wrap:anywhere}
.ci .tx span{display:block;color:var(--muted);font-size:.9rem;overflow-wrap:anywhere;margin-top:2px}
.ci .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* painel de desempenho */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start}
.chart-bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;padding-top:20px;border-bottom:1px solid var(--line)}
.c-col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.c-col .val{font:600 .72rem var(--f-mono);color:var(--muted)}
.c-col .pillar{width:100%;max-width:34px;background:var(--ok);border-radius:6px 6px 0 0;min-height:4px;transition:height .3s}
.c-col.today .pillar{background:var(--accent)}
.c-col .lbl{font:500 .74rem var(--f-mono);color:var(--muted);padding-top:4px}
.table-wrap{overflow-x:auto}
table.perf{width:100%;border-collapse:collapse;font-size:.9rem}
table.perf th,table.perf td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}
table.perf th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
table.perf td.num-c{font-family:var(--f-mono);text-align:right}
table.perf th.num-c{text-align:right}

.foot{color:var(--muted);font-size:.8rem;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:9px 18px;border-radius:99px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="14" fill="none" stroke="var(--track)" stroke-width="6"/><path d="M20 6 A14 14 0 0 1 34 20" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"/><path d="M34 20 A14 14 0 0 1 20 34" fill="none" stroke="var(--ok)" stroke-width="6" stroke-linecap="round"/></svg>
      <div><h1>Giro</h1><span>Ciclo de estudos para concursos</span></div>
    </div>
    <div class="top-right">
      <div class="stats" id="stats"></div>
      <button class="btn icon ghost" data-a="theme" title="Alternar tema claro/escuro" aria-label="Alternar tema">◐</button>
    </div>
  </header>
  <nav class="tabs" id="nav" aria-label="Seções"></nav>
  <main id="main"></main>
  <p class="foot">Seus cartões, questões e progresso ficam salvos neste navegador · Você pode exportar um backup na aba Desempenho.</p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const KEY='giro.v1', DAY=864e5;
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

function seed(){
  const subjects=[
    {id:'trib',name:'Direito Tributário',target:35,diff:'médio',done:12*60,totalSec:12*60,qDone:15,qHit:12,notes:''},
    {id:'cont',name:'Contabilidade Geral',target:35,diff:'difícil',done:0,totalSec:0,qDone:10,qHit:7,notes:''},
    {id:'cons',name:'Direito Constitucional',target:25,diff:'médio',done:0,totalSec:0,qDone:20,qHit:17,notes:''},
    {id:'econ',name:'Economia',target:30,diff:'médio',done:0,totalSec:0,qDone:0,qHit:0,notes:''},
    {id:'adm',name:'Direito Administrativo',target:20,diff:'fácil',done:0,totalSec:0,qDone:12,qHit:10,notes:''},
    {id:'rl',name:'Raciocínio Lógico',target:20,diff:'fácil',done:0,totalSec:0,qDone:8,qHit:7,notes:''}
  ];
  const C=[
   ['trib','Anterioridade anual (art. 150, III, "b", CF): o que veda?','Cobrar tributo no mesmo exercício financeiro em que foi publicada a lei que o instituiu ou aumentou.'],
   ['trib','Noventena (art. 150, III, "c", CF): o que veda?','Cobrar tributo antes de decorridos 90 dias da data da publicação da lei que o instituiu ou aumentou.'],
   ['trib','Fato gerador da obrigação principal, segundo o CTN.','Situação definida em lei como necessária e suficiente à sua ocorrência (art. 114, CTN).'],
   ['trib','Diferença entre imunidade e isenção.','Imunidade é limitação constitucional ao poder de tributar. Isenção é exclusão do crédito tributário, concedida por lei do ente competente (art. 175, I, CTN).'],
   ['cont','Equação fundamental do patrimônio.','Ativo = Passivo + Patrimônio Líquido.'],
   ['cont','O que diz o regime de competência?','Receitas e despesas são reconhecidas no período em que ocorrem os fatos geradores, independentemente do recebimento ou do pagamento.'],
   ['cont','O que são contas retificadoras do Ativo? Dê exemplos.','Contas de saldo credor que reduzem o valor de contas do Ativo. Exemplos: depreciação acumulada e PECLD.'],
   ['cont','Fórmula do índice de liquidez corrente.','Ativo Circulante ÷ Passivo Circulante.'],
   ['cons','Quais são os remédios constitucionais?','Habeas corpus, habeas data, mandado de segurança (individual e coletivo), mandado de injunção e ação popular.'],
   ['cons','Qual a duração do mandato do Presidente da República?','4 anos, com possibilidade de uma reeleição para o período subsequente (arts. 82 e 14, §5º, CF).'],
   ['cons','Quantos votos são necessários para aprovar uma emenda constitucional?','3/5 dos membros de cada Casa do Congresso, em dois turnos de votação (art. 60, §2º, CF).'],
   ['econ','O que mede a elasticidade-preço da demanda?','A variação percentual da quantidade demandada dividida pela variação percentual do preço.'],
   ['econ','Quando a demanda é inelástica?','Quando o módulo da elasticidade é menor que 1: a quantidade varia proporcionalmente menos que o preço.'],
   ['econ','O que é custo de oportunidade?','O valor da melhor alternativa à qual se renuncia ao fazer uma escolha.'],
   ['econ','A curva de Phillips original relaciona quais variáveis?','Inflação (ou variação salarial) e desemprego, com relação inversa no curto prazo.'],
   ['adm','Princípios expressos da Administração Pública no art. 37 da CF.','Legalidade, impessoalidade, moralidade, publicidade e eficiência (LIMPE).'],
   ['adm','Atributos do ato administrativo.','Presunção de legitimidade, imperatividade, autoexecutoriedade e tipicidade.'],
   ['rl','Negação de "Se p, então q".','p e não q (p ∧ ¬q).'],
   ['rl','Negação de "Todo A é B".','Algum A não é B.']
  ];
  return {lap:1,dailyGoal:120,sound:true,theme:'dark',subjects,log:{},cards:C.map(([sid,front,back])=>({id:uid(),sid,front,back,due:0,ivl:0,ease:2.5,reps:0}))};
}
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!Array.isArray(S.subjects)||!Array.isArray(S.cards))S=seed();
/* garante compatibilidade com estado salvo anteriormente */
if(!S.dailyGoal)S.dailyGoal=120;
if(S.sound===undefined)S.sound=true;
if(!S.theme)S.theme='dark';
S.subjects.forEach(s=>{
  if(s.totalSec===undefined)s.totalSec=s.done||0;
  if(s.qDone===undefined)s.qDone=0;
  if(s.qHit===undefined)s.qHit=0;
  if(s.notes===undefined)s.notes='';
});
document.documentElement.dataset.theme=S.theme;

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function beep(){
  if(!S.sound)return;
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx)return;
    const ctx=new Ctx(), o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(587.33,ctx.currentTime);
    o.frequency.setValueAtTime(880,ctx.currentTime+0.14);
    g.gain.setValueAtTime(0.12,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.45);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+0.45);
  }catch(e){}
}

const sub=id=>S.subjects.find(s=>s.id===id);
const logDay=()=>{const k=dkey(new Date());return S.log[k]||(S.log[k]={sec:0,rev:0,qDone:0,qHit:0})};
const dueCards=sid=>S.cards.filter(c=>c.due<=Date.now()&&(sid==null||c.sid===sid)).sort((a,b)=>a.due-b.due);
function streak(){
  const active=k=>S.log[k]&&(S.log[k].sec>0||S.log[k].rev>0);
  const d=new Date(); if(!active(dkey(d)))d.setDate(d.getDate()-1);
  let n=0; while(active(dkey(d))){n++;d.setDate(d.getDate()-1)}
  return n;
}
const curIdx=()=>S.subjects.findIndex(s=>s.done<s.target*60);
const fmtDays=d=>{
  if(d<=0)return '10 min';
  if(d<30)return Math.round(d)+' d';
  if(d<365)return (d/30).toFixed(1).replace('.0','').replace('.',',')+' m';
  return (d/365).toFixed(1).replace('.0','').replace('.',',')+' a';
};
function sched(c,q){
  let ease=c.ease, ivl=c.ivl;
  if(q===0)return {ivl:0,ease:Math.max(1.3,ease-.2),reps:0};
  if(q===1){ease=Math.max(1.3,ease-.15);ivl=Math.max(1,ivl*1.2)}
  if(q===2){ivl=(c.reps===0||ivl<1)?1:ivl*ease}
  if(q===3){ease+=.15;ivl=(c.reps===0||ivl<1)?3:Math.max(ivl*ease*1.3,ivl+2)}
  return {ivl:Math.round(ivl*10)/10,ease,reps:c.reps+1};
}

/* anel do ciclo */
function pt(cx,cy,r,a){const t=a*Math.PI/180;return [cx+r*Math.sin(t),cy-r*Math.cos(t)]}
function arc(cx,cy,r,a0,a1){
  const [x0,y0]=pt(cx,cy,r,a0),[x1,y1]=pt(cx,cy,r,a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${(a1-a0)>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
function ringSVG(){
  const total=S.subjects.reduce((n,s)=>n+s.target,0)||1, cur=curIdx();
  let a=0, out='';
  S.subjects.forEach((s,i)=>{
    const span=360*s.target/total, gap=Math.min(4,span*.2);
    const a0=a+gap/2, a1=a+span-gap/2, mid=a+span/2; a+=span;
    out+=`<path d="${arc(160,160,112,a0,a1)}" fill="none" stroke="var(--track)" stroke-width="26" stroke-linecap="butt"/>`;
    const f=Math.min(1,s.done/(s.target*60));
    if(f>0.002)out+=`<path d="${arc(160,160,112,a0,a0+(a1-a0)*f)}" fill="none" stroke="${i===cur?'var(--accent)':'var(--ok)'}" stroke-width="26" stroke-linecap="butt"/>`;
    const [lx,ly]=pt(160,160,146,mid);
    out+=`<text x="${lx.toFixed(1)}" y="${(ly+5).toFixed(1)}" text-anchor="middle" font-size="14" font-weight="600" fill="${i===cur?'var(--accent-text)':'var(--muted)'}" font-family="JetBrains Mono, monospace">${i+1}</text>`;
  });
  return `<svg viewBox="0 0 320 320" role="img" aria-label="Anel com as ${S.subjects.length} sessões da volta ${S.lap}">${out}</svg>`;
}

function rate(q){
  const id=study.queue[0], c=S.cards.find(x=>x.id===id); if(!c)return;
  const r=sched(c,q);
  c.ivl=r.ivl;c.ease=r.ease;c.reps=r.reps;
  c.due=Date.now()+(q===0?10*60000:r.ivl*DAY);
  logDay().rev++;
  study.queue.shift(); if(q===0)study.queue.push(id);
  study.flipped=false; save(); render();
}
const A={
  nav(d){study=null;pendingDel=null;editingCard=null;if(d.v==='revisao')openStudy(null);else{view=d.v;render()}},
  study(d){openStudy(d.id)},
  back(){study=null;view='ciclo';render()},
  flip(){study.flipped=true;render()},
  rate(d){rate(+d.q)},
  pause(){study.paused=!study.paused;$('#pausebtn').textContent=study.paused?'Retomar':'Pausar'},
  sound(){S.sound=!S.sound;save();render();toast(S.sound?'Alerta sonoro ativado':'Alerta sonoro silenciado')},
  theme(){S.theme=S.theme==='light'?'dark':'light';document.documentElement.dataset.theme=S.theme;save()},
  addmin(d){
    if(!study||!study.sid)return;
    const s=sub(study.sid);if(!s)return;
    const sec=(parseInt(d.m,10)||5)*60;
    s.done+=sec; s.totalSec=(s.totalSec||0)+sec; logDay().sec+=sec;
    if(!study.hit&&s.done>=s.target*60){study.hit=true;beep()}
    save();render();toast('+5 min registrados');
  },
  finishsub(){
    if(!study||!study.sid)return;
    const s=sub(study.sid);if(!s)return;
    const rem=Math.max(0,s.target*60-s.done);
    s.done+=rem; s.totalSec=(s.totalSec||0)+rem; logDay().sec+=rem;
    study.hit=true; beep(); save(); render(); toast('Sessão concluída');
  },
  next(){const i=curIdx();if(i>=0&&S.subjects[i].id!==study.sid)openStudy(S.subjects[i].id);else{study=null;view='ciclo';render()}},
  newlap(){S.lap++;S.subjects.forEach(s=>s.done=0);save();render();toast('Nova volta iniciada')},
  edit(){edit=!edit;render()},
  move(d){
    const idx=S.subjects.findIndex(s=>s.id===d.id), dir=parseInt(d.dir,10);
    const nIdx=idx+dir;
    if(idx<0||nIdx<0||nIdx>=S.subjects.length)return;
    const tmp=S.subjects[idx]; S.subjects[idx]=S.subjects[nIdx]; S.subjects[nIdx]=tmp;
    save();render();
  },
  delsub(d){
    if(S.subjects.length<=1)return;
    S.subjects=S.subjects.filter(s=>s.id!==d.id);
    save();render();toast('Matéria removida do ciclo');
  },
  editcard(d){editingCard=d.id;pendingDel=null;$('#clist').innerHTML=listHTML()},
  cancelcard(){editingCard=null;$('#clist').innerHTML=listHTML()},
  savecard(d){
    const c=S.cards.find(x=>x.id===d.id);if(!c)return;
    const f=$('#ec-front-'+c.id), b=$('#ec-back-'+c.id), sb=$('#ec-sub-'+c.id);
    if(f&&f.value.trim())c.front=f.value.trim();
    if(b&&b.value.trim())c.back=b.value.trim();
    if(sb&&sb.value)c.sid=sb.value;
    editingCard=null;save();$('#clist').innerHTML=listHTML();toast('Cartão atualizado');
  },
  delask(d){pendingDel=d.id;editingCard=null;$('#clist').innerHTML=listHTML()},
  delno(){pendingDel=null;$('#clist').innerHTML=listHTML()},
  delok(d){S.cards=S.cards.filter(c=>c.id!==d.id);pendingDel=null;save();$('#clist').innerHTML=listHTML();renderHead();renderNav();toast('Cartão excluído')},
  export(){
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`giro-backup-${dkey(new Date())}.json`;
    a.click();
    toast('Backup exportado');
  }
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset)});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='c-f'||t.id==='c-st'){$('#clist').innerHTML=listHTML();return}
  if(t.id==='imp-file'&&t.files&&t.files[0]){
    const r=new FileReader();
    r.onload=()=>{
      try{
        const data=JSON.parse(r.result);
        if(data&&Array.isArray(data.subjects)&&Array.isArray(data.cards)){
          S=data; save(); render(); toast('Backup importado com sucesso');
        }else toast('Arquivo inválido');
      }catch(err){toast('Erro ao ler arquivo JSON')}
    };
    r.readAsText(t.files[0]);
    return;
  }
  if(t.dataset&&t.dataset.f){
    const s=sub(t.dataset.id);if(!s)return;
    if(t.dataset.f==='name'&&t.value.trim())s.name=t.value.trim();
    if(t.dataset.f==='target')s.target=Math.max(5,parseInt(t.value,10)||s.target);
    if(t.dataset.f==='diff')s.diff=t.value;
    if(t.dataset.f==='notes'){s.notes=t.value;save();return}
    save();render();
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='c-q')$('#clist').innerHTML=listHTML();
  if(e.target.id==='s-notes'&&e.target.dataset.id){
    const s=sub(e.target.dataset.id);
    if(s){s.notes=e.target.value;save()}
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='f-new'){
    const sid=$('#c-sub').value,front=$('#c-front').value.trim(),back=$('#c-back').value.trim();
    if(!front||!back)return;
    window._lastSub=sid;
    S.cards.push({id:uid(),sid,front,back,due:0,ivl:0,ease:2.5,reps:0});
    save();$('#c-front').value='';$('#c-back').value='';$('#c-front').focus();
    $('#c-count').textContent=S.cards.length+' cartões no total';
    renderHead();renderNav();toast('Cartão adicionado');
  }
  if(e.target.id==='f-batch'){
    const sid=$('#b-sub').value, raw=$('#b-lines').value.trim();
    if(!raw)return;
    window._lastSub=sid;
    let added=0;
    raw.split(/\r?\n/).forEach(line=>{
      const parts=line.includes(';')?line.split(';'):line.split('\t');
      if(parts.length>=2){
        const front=parts[0].trim(), back=parts.slice(1).join(';').trim();
        if(front&&back){S.cards.push({id:uid(),sid,front,back,due:0,ivl:0,ease:2.5,reps:0});added++}
      }
    });
    if(added>0){save();$('#b-lines').value='';render();toast(`${added} cartões importados`)}
    else toast('Use o formato: Pergunta ; Resposta');
  }
  if(e.target.id==='f-sub'){
    const name=$('#as-name').value.trim();if(!name)return;
    S.subjects.push({id:uid(),name,target:Math.max(5,parseInt($('#as-min').value,10)||25),diff:$('#as-diff').value,done:0,totalSec:0,qDone:0,qHit:0,notes:''});
    save();render();toast('Matéria adicionada ao ciclo');
  }
  if(e.target.id==='f-qlog'&&study&&study.sid){
    const s=sub(study.sid);if(!s)return;
    const d=Math.max(1,parseInt($('#q-done').value,10)||0);
    const h=Math.min(d,Math.max(0,parseInt($('#q-hit').value,10)||0));
    s.qDone=(s.qDone||0)+d; s.qHit=(s.qHit||0)+h;
    const ld=logDay(); ld.qDone=(ld.qDone||0)+d; ld.qHit=(ld.qHit||0)+h;
    save();render();toast(`${h}/${d} questões registradas`);
  }
  if(e.target.id==='f-quickcard'&&study&&study.sid){
    const front=$('#qc-front').value.trim(), back=$('#qc-back').value.trim();
    if(!front||!back)return;
    const card={id:uid(),sid:study.sid,front,back,due:0,ivl:0,ease:2.5,reps:0};
    S.cards.push(card); study.queue.push(card.id);
    save();render();toast('Cartão criado e incluído na sessão');
  }
  if(e.target.id==='f-goal'){
    S.dailyGoal=Math.max(15,parseInt($('#g-min').value,10)||120);
    save();render();toast('Meta diária atualizada');
  }
});
document.addEventListener('keydown',e=>{
  if(view!=='study'||!study||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(e.key===' '&&!study.flipped&&study.queue.length){e.preventDefault();A.flip()}
  else if(study.flipped&&'1234'.includes(e.key)&&e.key.length===1)rate(+e.key-1);
});

/* cronômetro da sessão */
setInterval(()=>{
  if(view!=='study'||!study||study.sid==null||study.paused||document.hidden)return;
  const s=sub(study.sid);if(!s)return;
  s.done++;s.totalSec=(s.totalSec||0)+1;logDay().sec++;tick++;
  if(tick%5===0)save();
  const c=$('#clock');if(c)c.textContent=clk(s.done);
  const b=$('#bar');if(b)b.style.width=Math.min(100,s.done/(s.target*60)*100)+'%';
  const m=$('#st-min');if(m)m.textContent=Math.floor(logDay().sec/60)+' min';
  if(!study.hit&&s.done>=s.target*60){study.hit=true;beep();save();render()}
},1000);
window.addEventListener('pagehide',save);
render();
</script>
</body></html>
